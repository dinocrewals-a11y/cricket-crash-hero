<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Cricket Smash - Arcade Edition</title>
    <style>
        :root {
            --sky: #00B0FF;
            --grass: #4CAF50;
            --ui-bg: rgba(255, 255, 255, 0.95);
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #1B5E20;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: none;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(to bottom, var(--sky) 0%, var(--grass) 100%);
        }
        canvas {
            display: block;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            background-color: #A5D6A7;
            cursor: pointer;
        }
        
        #hud {
            position: absolute;
            top: 15px; width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex; justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }
        .stat-pill {
            background: rgba(255,255,255,0.9);
            padding: 6px 15px;
            border-radius: 50px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            text-align: center;
            min-width: 80px;
        }
        .stat-label { font-size: 0.65rem; font-weight: bold; color: #666; text-transform: uppercase; display: block; }
        .stat-val { font-size: 1.4rem; font-weight: 900; color: #1B5E20; line-height: 1; }

        .msg-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #onboarding { bottom: 180px; top: auto; width: 100%; }
        .hint-text { font-size: 1.2rem; font-weight: 900; text-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-top: 10px; }
        .sub-hint { font-size: 0.9rem; font-weight: 600; opacity: 0.9; margin-top: 4px; }
        
        #combo-wrap {
            position: absolute;
            left: 20px; top: 100px;
            opacity: 0; transition: opacity 0.3s;
        }
        #combo-val { font-size: 2.5rem; font-weight: 900; color: #FFEB3B; text-shadow: 2px 2px 0 #000; }

        #gameOverScreen {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100;
            backdrop-filter: blur(8px);
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 30px;
            width: 300px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: bounceIn 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.49);
            position: relative;
        }
        @keyframes bounceIn { from { transform: scale(0); } to { transform: scale(1); } }
        
        .new-best-badge {
            position: absolute;
            top: -15px; right: -15px;
            background: #f44336;
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: 900;
            transform: rotate(15deg);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from { transform: rotate(15deg) scale(1); } to { transform: rotate(15deg) scale(1.1); } }

        .btn-restart {
            background: #FFC107;
            color: #5D4037;
            padding: 20px 0;
            width: 100%;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 15px;
            border: none;
            border-bottom: 6px solid #FFA000;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.1s;
        }
        .btn-restart:active { transform: translateY(3px); border-bottom-width: 3px; }

        .hidden { display: none !important; }
        .fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud">
        <div class="stat-pill">
            <span class="stat-label">Score</span>
            <span id="scoreVal" class="stat-val">0</span>
        </div>
        <div class="stat-pill">
            <span class="stat-label">Best</span>
            <span id="bestVal" class="stat-val">0</span>
        </div>
    </div>

    <div id="combo-wrap">
        <div class="stat-label" style="color: white; text-shadow: 1px 1px 2px black">Combo</div>
        <div id="combo-val">x1</div>
    </div>

    <div id="onboarding" class="msg-overlay">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5))">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        <div class="hint-text">CLICK / TAP / SPACE TO HIT</div>
        <div class="sub-hint">MISS THE STUMPS = OUT</div>
    </div>

    <div id="intro-msg" class="msg-overlay">
        <h1 style="font-size: 3rem; margin: 0; text-shadow: 0 5px 15px rgba(0,0,0,0.6)">SMASH IT!</h1>
        <p style="font-weight: bold; font-size: 1.2rem;">SCORE AS MANY RUNS AS POSSIBLE</p>
    </div>

    <div id="gameOverScreen" class="hidden">
        <div class="card">
            <div id="newBestLabel" class="new-best-badge hidden">NEW BEST!</div>
            <h2 style="color: #d32f2f; margin: 0; font-size: 1.5rem;">BOWLED!</h2>
            <div style="font-size: 4rem; font-weight: 900; color: #1B5E20;" id="finalScore">0</div>
            <div style="color: #666; font-weight: bold;">TOTAL RUNS</div>
            <button class="btn-restart" id="restartBtn">PLAY AGAIN</button>
            <p style="font-size: 0.8rem; color: #aaa; margin-top: 10px;">PRESS SPACE OR TAP</p>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GW = 400;
const GH = 700;

let stats = JSON.parse(localStorage.getItem('mcs_stats')) || { highScore: 0 };
let state = 'PLAYING';
let score = 0;
let combo = 0;
let shake = 0;
let flashAlpha = 0;
let particles = [];
let popups = [];
let audience = [];
let gameTime = 0;
let sessionStartTime = Date.now();

const BallData = { 
    'PACER': { color: '#FF3D00', label: 'FAST' },
    'BOUNCER': { color: '#AA00FF', label: 'BOUNCE' },
    'CUTTER': { color: '#FF9100', label: 'CUTTER' },
    'GOOGLY': { color: '#FFEA00', label: 'GOOGLY' }
};

const Sound = {
    ctx: null,
    init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    play(f, t, d, v) {
        if(!this.ctx) return;
        try {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, this.ctx.currentTime);
            g.gain.setValueAtTime(v, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + d);
            o.connect(g); g.connect(this.ctx.destination);
            o.start(); o.stop(this.ctx.currentTime + d);
        } catch(e) {}
    }
};

const Batter = { x: GW/2, y: GH - 140, swinging: false, timer: 0, dur: 9 };
const Ball = { 
    active: false, x: GW/2, y: 150, vx: 0, vy: 0, z: 1, 
    type: 'PACER', status: 'IDLE', trail: [],
    swing: 0, spin: 0, bounceY: 0
};

for (let i = 0; i < 45; i++) {
    audience.push({
        x: Math.random() * GW, y: Math.random() * 110,
        color: `hsl(${Math.random() * 360}, 70%, 65%)`,
        offset: Math.random() * Math.PI * 2,
        cheerY: 0
    });
}

function resize() {
    const scale = Math.min(window.innerWidth / GW, window.innerHeight / GH);
    canvas.style.width = (GW * scale) + 'px';
    canvas.style.height = (GH * scale) + 'px';
    canvas.width = GW; canvas.height = GH;
}
window.addEventListener('resize', resize);
resize();

function bowl() {
    if(state !== 'PLAYING') return;
    Ball.active = true;
    Ball.status = 'BOWLED';
    Ball.y = 150; Ball.x = GW/2;
    Ball.trail = []; Ball.z = 0.5;
    
    Ball.bounceY = 400 + Math.random() * 100;

    const timeInGame = (Date.now() - sessionStartTime) / 1000;
    const isNewPlayerMode = timeInGame < 15; // Ease in for first 15 seconds

    const speedBase = Math.min(18, 10 + score / 8);
    const rand = Math.random();
    
    Ball.swing = 0;
    Ball.spin = 0;

    // Difficulty scaling: New players get basic pacers, experienced get variants
    if (!isNewPlayerMode && rand < 0.25 && score > 10) {
        Ball.type = 'BOUNCER'; 
        Ball.vy = speedBase * 0.75; 
        Ball.vx = (Math.random() - 0.5) * 2.5;
        Ball.swing = (Math.random() - 0.5) * 0.15;
        Ball.bounceY = 380 + Math.random() * 40;
    } else if (!isNewPlayerMode && rand < 0.5 && score > 5) {
        Ball.type = 'CUTTER'; 
        Ball.vy = speedBase * 0.95; 
        Ball.vx = (Math.random() - 0.5) * 1.5;
        Ball.spin = Math.random() > 0.5 ? 4 : -4;
    } else if (!isNewPlayerMode && rand < 0.75 && score > 20) {
        Ball.type = 'GOOGLY'; 
        Ball.vy = speedBase * 0.85; 
        Ball.vx = (Math.random() > 0.5 ? 3 : -3);
        Ball.swing = -Ball.vx * 0.05;
        Ball.spin = -Ball.vx * 1.8;
    } else {
        Ball.type = 'PACER'; 
        Ball.vy = speedBase; 
        Ball.vx = (Math.random() - 0.5) * 3;
        // Pacer swing is reduced for new players
        Ball.swing = (Math.random() - 0.5) * (isNewPlayerMode ? 0.05 : 0.25);
    }
}

function handleInput(e) {
    if(e && e.type === 'keydown' && e.repeat) return; // Prevent key spam
    if(e) e.preventDefault();
    Sound.init();
    
    if(state === 'GAMEOVER') { resetGame(); return; }
    if(Batter.swinging) return;

    document.getElementById('onboarding').classList.add('fade-out');
    document.getElementById('intro-msg').classList.add('fade-out');

    Batter.swinging = true;
    Batter.timer = Batter.dur;

    if(Ball.active && Ball.status !== 'HIT') {
        const dy = Math.abs(Ball.y - Batter.y);
        const dx = Math.abs(Ball.x - Batter.x);

        if(dy < 85 && dx < 75) {
            Ball.status = 'HIT';
            let run = 1;
            if(dy < 25) { 
                combo++; run = 6; flashAlpha = 0.4; shake = 18;
                addParticles(Ball.x, Ball.y, '#FFEB3B', 30);
                Sound.play(800, 'sine', 0.2, 0.4);
                audience.forEach(a => a.cheerY = -35);
                addPopup("SMASHED!", Ball.x, Ball.y - 50, '#FFEB3B');
            } else if(dy < 55) { 
                run = 4; shake = 8;
                addParticles(Ball.x, Ball.y, '#fff', 15);
                Sound.play(600, 'sine', 0.1, 0.2);
                addPopup("FOUR!", Ball.x, Ball.y - 40, '#fff');
            } else {
                run = 1; combo = 0;
                Sound.play(400, 'sine', 0.1, 0.1);
            }
            score += run;
            Ball.vy = -20 - Math.random() * 8;
            Ball.vx = (Ball.x - Batter.x) * 1.3 + (Math.random() * 16 - 8);
            Ball.z = 1.6;
            updateStatsUI();
            setTimeout(bowl, 800);
        }
    }
}

function updateStatsUI() {
    document.getElementById('scoreVal').innerText = score;
    document.getElementById('bestVal').innerText = stats.highScore;
    const cWrap = document.getElementById('combo-wrap');
    if(combo > 1) {
        cWrap.style.opacity = 1;
        document.getElementById('combo-val').innerText = 'x' + combo;
    } else {
        cWrap.style.opacity = 0;
    }
}

function out() {
    Ball.active = false;
    state = 'GAMEOVER';
    shake = 25;
    Sound.play(150, 'sawtooth', 0.4, 0.3);
    
    const isNewBest = score > stats.highScore;
    if(isNewBest) {
        stats.highScore = score;
        localStorage.setItem('mcs_stats', JSON.stringify(stats));
        document.getElementById('newBestLabel').classList.remove('hidden');
        // Celebration particles
        for(let i=0; i<3; i++) {
            setTimeout(() => addParticles(GW/2, GH/2, '#FFC107', 40), i*200);
        }
    } else {
        document.getElementById('newBestLabel').classList.add('hidden');
    }
    
    document.getElementById('finalScore').innerText = score;
    document.getElementById('bestVal').innerText = stats.highScore;
    document.getElementById('gameOverScreen').classList.remove('hidden');
}

function resetGame() {
    score = 0; combo = 0; state = 'PLAYING';
    sessionStartTime = Date.now(); // Reset the difficulty timer too
    updateStatsUI();
    document.getElementById('gameOverScreen').classList.add('hidden');
    bowl();
}

function addParticles(x, y, c, n) {
    for(let i=0; i<n; i++) {
        particles.push({ x, y, vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20, life: 1, c, s: Math.random()*6+3 });
    }
}

function addPopup(txt, x, y, c) { popups.push({ txt, x, y, life: 1, c }); }

function update() {
    gameTime++;
    audience.forEach(a => { a.cheerY *= 0.92; a.yOff = Math.sin(gameTime / 15 + a.offset) * 5; });
    
    if(Batter.swinging) { Batter.timer--; if(Batter.timer <= 0) Batter.swinging = false; }
    
    if(Ball.active) {
        if(Ball.status !== 'HIT') {
            Ball.vx += Ball.swing;
            Ball.y += Ball.vy; 
            Ball.x += Ball.vx;
            Ball.z = 0.5 + (Ball.y / GH) * 0.55;
            Ball.trail.push({x: Ball.x, y: Ball.y});
            if(Ball.trail.length > 5) Ball.trail.shift();
            
            if(Ball.y > Ball.bounceY && Ball.status === 'BOWLED') {
                Ball.status = 'BOUNCED';
                Ball.vx += Ball.spin;
                if(Ball.type === 'BOUNCER') Ball.vy *= 1.35;
                else if(Ball.type === 'GOOGLY') Ball.vy *= 0.8; 
                else Ball.vy *= 0.75;
                addParticles(Ball.x, Ball.y, '#D7CCC8', 5);
            }

            if(Ball.y > Batter.y + 15) {
                const wicketWidth = 24;
                if (Math.abs(Ball.x - GW/2) < wicketWidth) {
                    out();
                } else if (Ball.y > GH + 50) {
                    Ball.active = false;
                    combo = 0; 
                    updateStatsUI();
                    setTimeout(bowl, 500); 
                }
            }
        } else { 
            Ball.y += Ball.vy; 
            Ball.x += Ball.vx;
            Ball.vy += 0.65;
            Ball.z += 0.018; 
        }
    }

    particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; if(p.life <= 0) particles.splice(i, 1); });
    popups.forEach((p, i) => { p.y -= 2.5; p.life -= 0.03; if(p.life <= 0) popups.splice(i, 1); });
    
    if(shake > 0) shake *= 0.9;
    if(flashAlpha > 0) flashAlpha -= 0.06;

    if(gameTime > 180) {
        document.getElementById('intro-msg').classList.add('fade-out');
        document.getElementById('onboarding').classList.add('fade-out');
    }
}

function draw() {
    ctx.clearRect(0,0,GW,GH);
    ctx.save();
    if(shake > 1) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

    ctx.fillStyle = '#00B0FF'; ctx.fillRect(0, 0, GW, 140);
    audience.forEach(a => {
        ctx.fillStyle = a.color;
        ctx.beginPath(); ctx.arc(a.x, a.y + a.yOff + a.cheerY, 6, 0, Math.PI * 2); ctx.fill();
    });

    ctx.fillStyle = '#388E3C'; ctx.fillRect(0, 140, GW, GH-140);
    ctx.fillStyle = '#F5F5DC'; ctx.beginPath();
    ctx.moveTo(GW/2-35, 140); ctx.lineTo(GW/2+35, 140);
    ctx.lineTo(GW/2+110, GH); ctx.lineTo(GW/2-110, GH); ctx.fill();
    
    ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(GW/2-95, Batter.y + 40); ctx.lineTo(GW/2+95, Batter.y + 40); ctx.stroke();

    if(Ball.active && Ball.status !== 'HIT' && Ball.y > GH - 280) {
        const progress = Math.max(0, (Ball.y - (GH - 280)) / 140);
        const grad = ctx.createRadialGradient(GW/2, Batter.y, 5, GW/2, Batter.y, 100);
        grad.addColorStop(0, `rgba(255, 255, 255, ${progress * 0.35})`);
        grad.addColorStop(1, `rgba(255, 255, 255, 0)`);
        ctx.fillStyle = grad; ctx.fillRect(0, GH-300, GW, 200);
    }

    ctx.fillStyle = '#FFD54F'; 
    for(let i=-1; i<=1; i++) ctx.fillRect(GW/2 + i*8 - 1.5, Batter.y+20, 3, 30);

    ctx.save();
    ctx.translate(Batter.x, Batter.y);
    ctx.fillStyle = '#0D47A1'; ctx.fillRect(-12, -18, 24, 36);
    ctx.fillStyle = '#FFE0B2'; ctx.beginPath(); ctx.arc(0, -30, 14, 0, Math.PI*2); ctx.fill();
    
    let swingAngle = Batter.swinging ? -Math.PI * 0.9 * (Batter.timer / Batter.dur) : -0.25;
    ctx.rotate(swingAngle);
    ctx.fillStyle = '#8D6E63'; ctx.fillRect(-6, -65, 12, 65);
    ctx.fillStyle = '#212121'; ctx.fillRect(-6, 0, 12, -15);
    ctx.restore();

    if(Ball.active) {
        const bCol = Ball.status === 'HIT' ? '#FFEB3B' : BallData[Ball.type].color;
        ctx.save();
        Ball.trail.forEach((t, i) => {
            ctx.globalAlpha = (i / Ball.trail.length) * 0.4;
            ctx.fillStyle = bCol;
            ctx.beginPath(); ctx.arc(t.x, t.y, 6 * Ball.z, 0, Math.PI*2); ctx.fill();
        });
        ctx.restore();

        ctx.save();
        ctx.translate(Ball.x, Ball.y);
        ctx.scale(Ball.z, Ball.z);
        ctx.shadowBlur = 15; ctx.shadowColor = bCol;
        ctx.fillStyle = bCol;
        ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(0, 0, 10, -0.6, 0.6); ctx.stroke();
        ctx.restore();
    }

    particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); });
    popups.forEach(p => { 
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.font = '900 36px Arial';
        ctx.textAlign = 'center'; ctx.shadowBlur = 6; ctx.shadowColor = 'black';
        ctx.fillText(p.txt, p.x, p.y); 
    });
    ctx.restore();

    if(flashAlpha > 0) { ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`; ctx.fillRect(0,0,GW,GH); }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

window.addEventListener('mousedown', handleInput);
window.addEventListener('touchstart', handleInput, {passive: false});
window.addEventListener('keydown', (e) => { 
    if(e.code === 'Space' || e.code === 'Enter') handleInput(e); 
});
document.getElementById('restartBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    resetGame();
});

document.getElementById('bestVal').innerText = stats.highScore;
setTimeout(() => { if(state === 'PLAYING') bowl(); }, 1000); 
loop();
</script>
</body>
</html>
